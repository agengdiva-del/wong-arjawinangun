<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable !== false && !desc.writable && !desc.set) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () { return currentFetch; },
              set: function (fn) { if (typeof fn === 'function') currentFetch = fn; }
            });
          }
        } catch (e) {}
        window.addEventListener('error', function (event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
